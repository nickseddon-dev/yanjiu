[project]
name = "quant-os"
version = "0.1.0"
requires-python = ">=3.11"
description = "Crypto sentiment quant trading monorepo"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.raft]
workspaces = [
    "packages/common_schema",
    "packages/event_schema",
    "packages/feature_registry",
    "packages/model_registry",
    "packages/risk_rules",
    "packages/cost_models",
    "packages/adapters",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
