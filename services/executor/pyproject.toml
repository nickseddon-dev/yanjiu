[project]
name = "executor"
version = "0.1.0"
description = "Live-host signal executor: consumes signals, risk-checks, executes orders"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "redis[hires]>=5.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]