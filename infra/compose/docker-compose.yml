version: "3.8"

networks:
  quant-os-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prefect_data:
  prometheus_data:
  grafana_data:

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: quantos
      POSTGRES_USER: quantos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantos_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant-os-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantos -d quantos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - quant-os-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect:
    image: prefecthq/prefect:3-python3.11
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
    volumes:
      - prefect_data:/var/lib/prefect
    networks:
      - quant-os-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - quant-os-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring:/etc/grafana/provisioning
    networks:
      - quant-os-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== SERVICES ====================

  data_gateway:
    build:
      context: .
      dockerfile: services/data_gateway/Dockerfile
    ports:
      - "8091:8091"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: quantos
      POSTGRES_USER: quantos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantos_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PREFECT_API_URL: http://prefect:4200/api
    networks:
      - quant-os-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prefect:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  event_gateway:
