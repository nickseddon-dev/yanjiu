global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "data_gateway"
    static_configs:
      - targets: ["data_gateway:8091"]

  - job_name: "event_gateway"
    static_configs:
      - targets: ["event_gateway:8092"]

  - job_name: "signal_publisher"
    static_configs:
      - targets: ["signal_publisher:8093"]

  - job_name: "feature_service"
    static_configs:
      - targets: ["feature_service:8094"]

  - job_name: "orchestrator"
    static_configs:
      - targets: ["orchestrator:8095"]

  - job_name: "risk_control"
    static_configs:
      - targets: ["risk_control:8096"]

  - job_name: "execution_control"
    static_configs:
      - targets: ["execution_control:8097"]

  - job_name: "report_generator"
    static_configs:
      - targets: ["report_generator:8098"]

  - job_name: "signal_bridge"
    static_configs:
      - targets: ["signal_bridge:8090"]

  - job_name: "research_runner"
    static_configs:
      - targets: ["research_runner:8099"]

  - job_name: "executor"
    static_configs:
      - targets: ["executor:8100"]